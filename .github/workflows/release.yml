name: Release dixtra

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag is the version of the build
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versions="$(grep -E '^[[:space:]]*version[[:space:]]*:=' build.sbt | grep -o '"[^"]*"' | tr -d '"' | sort -u)"
          if [ -z "$versions" ] || [ "$(printf '%s\n' "$versions" | grep -c .)" -ne 1 ] || [ "$versions" != "$tag" ]; then
            echo "the tag $tag does not match the version(s) of build.sbt: $versions"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Test the API documentation
        run: sbt doc

  executables:
    name: Executable (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build the native executable
        run: sbt dixtraCli/nativeImage

      - name: Collect and check the executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          executable="$(find . -type f -path '*/native/dixtra' ! -path './dixtra-vscode/*' | head -n 1)"
          if [ -z "$executable" ]; then echo "native executable not found"; exit 1; fi
          cp "$executable" "dist/${{ matrix.platform }}/dixtra"
          "./dist/${{ matrix.platform }}/dixtra" --version

      - name: Collect and check the executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.platform }}" | Out-Null
          $executable = Get-ChildItem -Path . -Recurse -Filter dixtra.exe -File |
            Where-Object { $_.Directory.Name -eq 'native' } | Select-Object -First 1
          if (-not $executable) { Write-Error "native executable not found"; exit 1 }
          Copy-Item $executable.FullName "dist/${{ matrix.platform }}/dixtra.exe"
          & "dist/${{ matrix.platform }}/dixtra.exe" --version

      - name: Upload the executable
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  extension:
    name: VS Code extension
    needs: [test, executables]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Download the Linux executable
        uses: actions/download-artifact@v8
        with:
          name: executable-linux-x64
          path: dist/

      - name: Download the Windows executable
        uses: actions/download-artifact@v8
        with:
          name: executable-win32-x64
          path: dist/

      - name: Download the macOS executable
        uses: actions/download-artifact@v8
        with:
          name: executable-darwin-arm64
          path: dist/

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Package the extension for every platform
        run: sbt ";dixtraVsCode/vscodePackageLinux;dixtraVsCode/vscodePackageWin;dixtraVsCode/vscodePackageMac"

      - name: Upload the .vsix files
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [executables, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the Linux executable
        uses: actions/download-artifact@v8
        with:
          name: executable-linux-x64
          path: dist/

      - name: Download the Windows executable
        uses: actions/download-artifact@v8
        with:
          name: executable-win32-x64
          path: dist/

      - name: Download the macOS executable
        uses: actions/download-artifact@v8
        with:
          name: executable-darwin-arm64
          path: dist/

      - name: Download the .vsix files
        uses: actions/download-artifact@v8
        with:
          name: vscode-extension
          path: dist/

      - name: Prepare the assets
        run: |
          set -euo pipefail

          chmod +x dist/linux-x64/dixtra dist/darwin-arm64/dixtra

          # The executables are copied with their platform in the name: the Linux and the macOS ones share the name
          # `dixtra`, and the assets of a release cannot share one.
          cp dist/linux-x64/dixtra dist/dixtra-linux-x64
          cp dist/win32-x64/dixtra.exe dist/dixtra-win32-x64.exe
          cp dist/darwin-arm64/dixtra dist/dixtra-darwin-arm64

          assets=(
            dist/dixtra-linux-x64
            dist/dixtra-win32-x64.exe
            dist/dixtra-darwin-arm64
          )

          # Every platform has its own extension: the one of a platform that is missing fails the release, rather
          # than leaving the users of that platform without an extension.
          for platform in linux-x64 win32-x64 darwin-arm64; do
            found=()
            for vsix in dist/dixtra-vscode-$platform-*.vsix; do
              if [ -f "$vsix" ]; then found+=("$vsix"); fi
            done
            if [ "${#found[@]}" -ne 1 ]; then
              echo "expected one .vsix for $platform, found ${#found[@]}"
              exit 1
            fi
            assets+=("${found[0]}")
          done

          printf '%s\n' "${assets[@]}" > assets.txt
          cat assets.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t assets < assets.txt

          if ! gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          fi

      - name: Check the assets of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          attached="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"

          expected=(
            dixtra-linux-x64
            dixtra-win32-x64.exe
            dixtra-darwin-arm64
            dixtra-vscode-linux-x64-*.vsix
            dixtra-vscode-win32-x64-*.vsix
            dixtra-vscode-darwin-arm64-*.vsix
          )

          for pattern in "${expected[@]}"; do
            found=0
            while IFS= read -r asset; do
              case "$asset" in
                $pattern) found=1 ;;
              esac
            done <<< "$attached"
            if [ "$found" -ne 1 ]; then
              echo "the release has no asset matching $pattern"
              printf '%s\n' "$attached"
              exit 1
            fi
          done

          printf '%s\n' "$attached"
