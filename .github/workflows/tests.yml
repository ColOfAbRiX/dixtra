name: Build and test dixtra

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'

jobs:
  test_dixtra:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      # - name: Check the scalafix rules
      #   run: sbt "scalafixAll --check"

      - name: Test the API documentation
        run: sbt doc

  # The sbt plugin's scripted tests: they publish dixtra locally first, so they run apart from `sbt test`
  test_sbt_plugin:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run the scripted tests of the sbt plugin
        run: sbt sbtDixtra/scripted
