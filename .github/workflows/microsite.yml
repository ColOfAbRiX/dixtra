name: Build and publish the documentation microsite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/microsite.yml"
      - "dixtra-microsite/**"
      - "project/**"
      - "build.sbt"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/microsite.yml"
      - "dixtra-microsite/**"
      - "project/**"
      - "build.sbt"

jobs:
  publish_microsite:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Cache the sbt boot and the coursier caches
        uses: actions/cache@v6
        with:
          # The launcher of the sbt 1.13 sub-build keeps its boot jars where neither setup-java nor
          # setup-sbt cache them; without them it downloads sbt 1.13.0 from Maven Central, which
          # rate-limits GitHub-hosted runners with HTTP 429 (run 44579525829)
          path: |
            ~/.sbt/boot
            ~/.cache/coursier/v1
            ~/.coursier/v1
          key: microsite-sbt-${{ hashFiles('dixtra-microsite/project/build.properties', 'dixtra-microsite/project/plugins.sbt') }}
          restore-keys: |
            microsite-sbt-

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "sbt"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Stage the API documentation
        run: sbt copyApiDocsToSite

      # Laika renders the site from the markdown under dixtra-microsite/docs; the `site` task then drops the
      # staged scaladoc into target/docs/site/api. No Ruby and no Jekyll are involved.
      - name: Build the microsite
        run: |
          cd dixtra-microsite
          sbt --no-global site

      - name: Publish the microsite
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          publish_branch: gh-pages
          publish_dir: dixtra-microsite/target/docs/site
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
