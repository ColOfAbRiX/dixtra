# The aliases of the settings of dixtra. It is not a configuration file, and users don't edit it: the README describes
# the aliases, and links here for the full list.
#
# An alias is a name that sets one or more settings at once, the alias written in quotes and its settings in a list:
#
#   "scaladoc.align-tags" = [ "alignment.scaladoc.tags" ]
#
# The settings of an alias must accept the same values. An alias must not be a setting of reference.conf, nor a section
# holding settings. The tests check both, and that every setting of an alias exists.
#
# Aliases are resolved when a configuration is loaded, on the settings the user wrote: each alias sets each of its
# settings to its value. A setting given more than once, directly or through aliases, must get the same value every
# time, otherwise the configuration is rejected.
aliases {
  "abstract-class.braces"        = [ "braces.abstract-class" ]
  "abstract-class.body-edges"    = [ "blank-lines.body-edges.abstract-class" ]
  "abstract-class.align-extends" = [ "alignment.extends-clauses" ]

  "assignment.body"              = [ "body.assignment" ]

  "block-argument.braces"        = [ "braces.block-argument" ]
  "block-argument.body"          = [ "body.block-argument" ]
  "block-argument.body-edges"    = [ "blank-lines.body-edges.block-argument" ]

  "case-body.braces"             = [ "braces.case-body" ]
  "case-body.body"               = [ "body.case-body" ]
  "case-body.body-edges"         = [ "blank-lines.body-edges.case-body" ]
  "case-body.align-arrows"       = [ "alignment.arrows.cases" ]

  "case-class.braces"            = [ "braces.case-class" ]
  "case-class.body-edges"        = [ "blank-lines.body-edges.case-class" ]
  "case-class.align-extends"     = [ "alignment.extends-clauses" ]

  "class.braces"                 = [ "braces.class" ]
  "class.body-edges"             = [ "blank-lines.body-edges.class" ]
  "class.align-extends"          = [ "alignment.extends-clauses" ]

  "def.braces"                   = [ "braces.def" ]
  "def.body"                     = [ "body.def" ]
  "def.body-edges"               = [ "blank-lines.body-edges.def" ]
  "def.groups-separator"         = [ "definition-site.groups-separator" ]

  "enum.braces"                  = [ "braces.enum" ]
  "enum.body-edges"              = [ "blank-lines.body-edges.enum" ]
  "enum.align-extends"           = [ "alignment.extends-clauses" ]

  "extension.braces"              = [ "braces.extension" ]
  "extension.body-edges"          = [ "blank-lines.body-edges.extension" ]

  "for.braces"                    = [ "braces.for" ]
  "for.body"                      = [ "body.for" ]
  "for.body-edges"                = [ "blank-lines.body-edges.for" ]
  "for.align-arrows"              = [ "alignment.arrows.for-enumerators" ]
  "for.chains"                    = [ "selector-chain.in-for" ]

  "for-yield.braces"              = [ "braces.for-yield" ]
  "for-yield.body"                = [ "body.for-yield" ]
  "for-yield.body-edges"          = [ "blank-lines.body-edges.for-yield" ]
  "for-yield.align-arrows"        = [ "alignment.arrows.for-enumerators" ]
  "for-yield.chains"              = [ "selector-chain.in-for" ]

  "given-alias.braces"            = [ "braces.given-alias" ]
  "given-alias.body"              = [ "body.given-alias" ]
  "given-alias.body-edges"        = [ "blank-lines.body-edges.given-alias" ]

  "given-instance.braces"         = [ "braces.given-instance" ]
  "given-instance.body-edges"     = [ "blank-lines.body-edges.given-instance" ]

  "if.braces"                     = [ "braces.if" ]
  "if.body"                       = [ "body.if" ]
  "if.body-edges"                 = [ "blank-lines.body-edges.if" ]

  "lambda-argument.braces"        = [ "braces.lambda-argument" ]
  "lambda-argument.body"          = [ "body.lambda-argument" ]
  "lambda-argument.body-edges"    = [ "blank-lines.body-edges.lambda-argument" ]

  "lambda-body.braces"            = [ "braces.lambda-body" ]
  "lambda-body.body"              = [ "body.lambda-body" ]
  "lambda-body.body-edges"        = [ "blank-lines.body-edges.lambda-body" ]

  "lazy-val.braces"               = [ "braces.lazy-val" ]
  "lazy-val.body"                 = [ "body.lazy-val" ]
  "lazy-val.body-edges"           = [ "blank-lines.body-edges.lazy-val" ]

 "match.braces"             = [ "braces.match" ]
 "match.body-edges"         = [ "blank-lines.body-edges.match" ]
 "match.align-arrows"       = [ "alignment.arrows.cases" ]

 "named-argument.body"      = [ "body.named-argument" ]
 "named-argument.align-equals" = [ "alignment.named-arguments" ]

 "new-anonymous.braces"     = [ "braces.new-anonymous" ]
 "new-anonymous.body-edges" = [ "blank-lines.body-edges.new-anonymous" ]

 "object.braces"            = [ "braces.object" ]
 "object.body-edges"        = [ "blank-lines.body-edges.object" ]
 "object.align-extends"     = [ "alignment.extends-clauses" ]

 "package.braces"           = [ "braces.package" ]
 "package.body-edges"       = [ "blank-lines.body-edges.package" ]

 "package-object.braces"    = [ "braces.package-object" ]
 "package-object.body-edges" = [ "blank-lines.body-edges.package-object" ]

 "test-block.braces"        = [ "braces.test-block" ]
 "test-block.body"          = [ "body.test-block" ]
 "test-block.body-edges"    = [ "blank-lines.body-edges.test-block" ]

 "trait.braces"             = [ "braces.trait" ]
 "trait.body-edges"         = [ "blank-lines.body-edges.trait" ]
 "trait.align-extends"      = [ "alignment.extends-clauses" ]

 "try.braces"               = [ "braces.try" ]
 "try.body"                 = [ "body.try" ]
 "try.body-edges"           = [ "blank-lines.body-edges.try" ]

 "type.body"                = [ "body.type" ]

 "val.braces"               = [ "braces.val" ]
 "val.body"                 = [ "body.val" ]
 "val.body-edges"           = [ "blank-lines.body-edges.val" ]

   "var.braces"                    = [ "braces.var" ]
   "var.body"                      = [ "body.var" ]
   "var.body-edges"                = [ "blank-lines.body-edges.var" ]

   "while.braces"                  = [ "braces.while" ]
   "while.body"                    = [ "body.while" ]
   "while.body-edges"              = [ "blank-lines.body-edges.while" ]

   "comments.align-trailing"       = [ "alignment.trailing-comments" ]
   "comments.align-across"         = [ "alignment.across-comments" ]
   "comments.trailing-overflow"    = [ "trailing-comment-overflow" ]

   "scaladoc.blank-line-before"    = [ "blank-lines.before-scaladoc" ]
   "scaladoc.align-tags"           = [ "alignment.scaladoc.tags" ]
}
