# DIXTRA CONFIGURATION FILE
#
# The configuration of dixtra, with the default value of every setting.
#
# A project overrides only the settings it changes, in a `.dixtra.conf` file in its root or in any directory above the
# files it formats, or on the command line with `--config-string` / `--config-path`.
#
# An unknown key is ignored with a warning naming it, and an invalid value is rejected.
#
# Example `.dixtra.conf`:
#
#   max-column = 100
#   braces { style = stroustrup, if = force-braces, match = force-indent }
#   paths.excluded = ["**/generated/**"]
#
# The settings groups, in order:
#
#   config-version   The version of this schema
#   max-column       The width that makes a construct break
#
#   alignment        What lines up in columns
#   blank-lines      Blank lines at the edges of bodies, between groups and before scaladocs
#   body             Whether a body stays on the line of its `=` / `=>` / `then` / `do`, or goes below it
#   braces           Braces, `end` markers or indentation for each construct, and where braces go
#   call-site        The arguments of a call and the elements of a tuple: groups and commas
#   definition-site  The parameters of a `def` or a class, and the selectors of an import: groups and commas
#   selector-chain   When a chain of selections `a.b(c).d` breaks, one selection per line
#
#   housekeeping     Trailing whitespace, the line break at the end of the file, line endings
#   paths            The files of a directory to format
#   path-overrides   Other settings for some of the files
#   overflow         What happens to what goes past `max-column`
#
# Several sections have one setting per construct, with the same key in each of them:
#
#   abstract-class   `abstract class A { ... }`
#   block-argument   A block of statements given as an argument: `Resource.make { open() }`
#   case-body        The body of a `case` clause, after its `=>`
#   case-class       `case class A(x: Int) { ... }`
#   class            `class A { ... }`
#   def              The body of a `def`, after its `=`
#   enum             `enum Color { ... }`
#   extension        `extension (s: String) { ... }`
#   for              A `for` loop, without `yield`: `for x <- xs do ...`
#   for-yield        A for-comprehension: `for x <- xs yield ...`
#   given-alias      The body of a given alias, after its `=`: `given Ord[Int] = ...`
#   given-instance   `given Ord[Int] with { ... }`
#   if               An if/else
#   lambda-argument  A lambda or a `{ case ... }` given as an argument: `xs.map { x => ... }`
#   lambda-body      The body of any other lambda, after its `=>`: `val f = (x: Int) => ...`
#   lazy-val         The body of a `lazy val`, after its `=`
#   match            A `match`
#   new-anonymous    An anonymous class: `new Runnable { ... }`
#   object           `object A { ... }`
#   package          The single package clause of a file: `package a.b`
#   package-object   `package object a { ... }`
#   test-block       The block of a test case: `test("a parser") { ... }`, `"a parser" in { ... }`
#   trait            `trait A { ... }`
#   try              A `try` / `catch` / `finally`
#   val              The body of a `val`, after its `=`
#   var              The body of a `var`, after its `=`
#   while            A `while` loop
#

#
# The version of this configuration schema, a semantic version.
#
# A configuration without it is read as the current version. One written for a later version, or for another major
# version, is rejected instead of being half understood.
#
#   1.0.0 - the current version.
#
config-version = 1.0.0

#
# The longest a line can be.
#
# A construct whose one-line form does not fit within this width breaks.
#
#   <number> - the width, in characters. With 40:
#     def f = compute(first, second)
#
#     def g =
#       compute(firstArgument, secondArgument)
#
max-column = 120

#
# Whether each construct writes its body in braces, braceless with an `end` marker, or braceless; and where braces go.
#
# Every construct of the list at the top of this file has a setting, which takes one of these values:
#
#   force-braces - in curly braces:
#     class A {
#       def f = 1
#     }
#
#   force-end - braceless, closed by an `end` marker when it spans several lines:
#     class A:
#       def f = 1
#     end A
#
#   force-indent - braceless and without an `end` marker, the body only indented:
#     class A:
#       def f = 1
#
#   keep - as the author wrote it.
#
# A construct without a setting is `keep`.
#
# The constructs that have no `end` marker (`block-argument`, `case-body`, `lambda-argument`, `lambda-body`,
# `test-block`) reject `force-end`.
#
# A `for`, `while` or `if` written on one line that fits stays as it is, and a case class or an object without a body
# never gets braces. Each example below shows the other form of the construct, the one its default does not write.
#
braces {
  #
  # When braces are selected, where the braces go relative to the code around them.
  #
  # It applies to every brace dixtra writes; the braces of an argument (`xs.map { x => ... }`) and of a body after `=>`
  # stay where they are.
  #
  #   1tbs - "One True Braces Style". `{` at the end of the header line, `} else {` on one line:
  #     if (c) {
  #       a()
  #     } else {
  #       b()
  #     }
  #
  #   stroustrup - as 1tbs, with `else`, `catch`, `finally` and `yield` starting the line after the closing `}`:
  #     if (c) {
  #       a()
  #     }
  #     else {
  #       b()
  #     }
  #
  #   allman - as stroustrup, with every opening `{` of a body on its own line:
  #     if (c)
  #     {
  #       a()
  #     }
  #     else
  #     {
  #       b()
  #     }
  #
  style = 1tbs

  #
  # Whether the single selector of an `import` or `export` is in braces.
  #
  # The selectors keep their spelling (`_` / `*`, `=>` / `as`), and an import with several selectors always keeps its
  # braces.
  #
  #   force-braces - always in braces:
  #     import a.{ B }
  #     import a.{ * }
  #
  #   avoid-braces - without braces where the selector can stand alone; a rename keeps them:
  #     import a.B
  #     import a.*
  #     import a.{ B => C }
  #
  #   keep - as the author wrote it.
  #
  imports = keep

  #
  # `abstract class A { ... }`. With force-indent:
  #
  #   abstract class A:
  #     def f: Int
  #
  abstract-class = force-braces

  #
  # A block of statements given as an argument, without lambda parameters, that is not a test block. After an operator
  # its braces always stay. With force-indent:
  #
  #   Resource.make:
  #     open()
  #
  block-argument = force-braces

  #
  # The body of a `case` clause over several lines. With force-braces:
  #
  #   case p => {
  #     a()
  #     b()
  #   }
  #
  case-body = force-indent

  #
  # `case class A(x: Int) { ... }`; a case class without a body never gets braces. With force-indent:
  #
  #   case class A(x: Int):
  #     def f = x
  #
  case-class = force-braces

  #
  # `class A { ... }`. With force-indent:
  #
  #   class A:
  #     def f = 1
  #
  class = force-braces

  #
  # The body of a `def` over several lines. With force-braces:
  #
  #   def f = {
  #     val a = 1
  #     a + 1
  #   }
  #
  def = force-indent

  #
  # `enum Color { ... }`. With force-indent:
  #
  #   enum Color:
  #     case Red
  #     case Green
  #
  enum = force-braces

  #
  # An `extension` with several methods. With force-indent:
  #
  #   extension (s: String)
  #     def a = s
  #     def b = s
  #
  extension = force-braces

  #
  # A `for` loop, without `yield`. With force-braces:
  #
  #   for {
  #     x <- xs
  #   } {
  #     a(x)
  #   }
  #
  for = force-indent

  #
  # A for-comprehension. With force-braces:
  #
  #   for {
  #     x <- xs
  #     y <- ys
  #   } yield {
  #     x + y
  #   }
  #
  for-yield = force-indent

  #
  # The body of a given alias over several lines. With force-braces:
  #
  #   given Ord[Int] = {
  #     val b = 1
  #     ord(b)
  #   }
  #
  given-alias = keep

  #
  # `given Ord[Int] with { ... }`. With force-indent:
  #
  #   given Ord[Int] with
  #     def compare(a: Int, b: Int) = a - b
  #
  given-instance = force-braces

  #
  # An if/else; the two forms are never mixed in one if/else. With force-braces:
  #
  #   if (c) {
  #     a()
  #   } else {
  #     b()
  #   }
  #
  if = force-indent

  #
  # A lambda given as an argument. With force-indent:
  #
  #   xs.map: x =>
  #     x + 1
  #
  lambda-argument = force-braces

  #
  # The body of any other lambda over several lines. With force-braces:
  #
  #   val f =
  #     (x: Int) => {
  #       val y = x
  #       y + 1
  #     }
  #
  lambda-body = keep

  #
  # The body of a `lazy val` over several lines. With force-braces:
  #
  #   lazy val a = {
  #     val b = 1
  #     b + 1
  #   }
  #
  lazy-val = force-indent

  #
  # A `match`. With force-indent:
  #
  #   x match
  #     case 1 => a
  #     case 2 => b
  #
  match = force-braces

  #
  # An anonymous class. With force-indent:
  #
  #   new Runnable:
  #     def run() = ()
  #
  new-anonymous = force-braces

  #
  # `object A { ... }`; an object without a body never gets braces. With force-indent:
  #
  #   object A:
  #     val a = 1
  #
  object = force-braces

  #
  # The single package clause of a file, without nested ones. With force-braces:
  #
  #   package a.b {
  #
  #     object C
  #
  #   }
  #
  package = force-indent

  #
  # `package object a { ... }`. With force-braces:
  #
  #   package object a {
  #     val x = 1
  #   }
  #
  package-object = keep

  #
  # The block of a test case: a block of statements given to a call labelled by a string, as the test cases of
  # ScalaTest, MUnit, specs2 or utest are.
  #
  # After an operator (`"a parser" should { ... }`) its braces always stay, so only a call takes the braceless form.
  # With force-indent:
  #
  #   test("a parser"):
  #     parse("1")
  #
  test-block = force-braces

  #
  # `trait A { ... }`. With force-indent:
  #   trait A:
  #     def f: Int
  #
  trait = force-braces

  #
  # A `try` / `catch` / `finally`. With force-indent:
  #
  #   try
  #     a()
  #   finally
  #     b()
  #
  try = force-braces

  #
  # The body of a `val` over several lines. With force-braces:
  #
  #   val a = {
  #     val b = 1
  #     b + 1
  #   }
  #
  val = force-indent

  #
  # The body of a `var` over several lines. With force-braces:
  #
  #   var a = {
  #     val b = 1
  #     b + 1
  #   }
  #
  var = force-indent

  #
  # A `while` loop. With force-indent:
  #
  #   while c do
  #     step()
  #     more()
  #
  while = force-braces
}

#
# When a chain of selections (`a.b(x).c.d`) breaks, one selection per line.
#
# A chain always breaks when it does not fit, or when the author broke it before a dot.
#
# A broken chain has its receiver on the first line and each selection below it, one level in:
#
#   xs
#     .filter(_.paid)
#     .map(_.amount)
#     .sum
#
selector-chain {
  #
  # Whether a chain on the line of its `=` / `=>` breaks at `break-at-count` selections too.
  #
  #   break-at-count - it breaks like a chain written below the `=`, and goes below it:
  #     val y =
  #       xs
  #         .map(_ + 1)
  #         .filter(_ > 0)
  #         .sum
  #
  #   keep - it stays on one line while it fits:
  #     val y = xs.map(_ + 1).filter(_ > 0).sum
  #
  inline-chains = break-at-count

  #
  # How many selections make a chain that is a whole body break, even when it fits.
  #
  # The receiver (`xs`) does not count. 
  #
  # A chain inside an operation, an argument or a condition breaks only when it does not fit, or when the author broke
  # it: `p.speed.vertical >= config.minSpeed` stays on one line. 
  #
  # A chain on the line of its `=` follows `inline-chains`.
  #
  #   <number> - at least 2. With 3, two selections stay on one line and three break:
  #     def total =
  #       xs.map(_.amount).sum
  #
  #     def total =
  #       xs
  #         .filter(_.paid)
  #         .map(_.amount)
  #         .sum
  #
  break-at-count = 3

  #
  # How a chain breaks in the enumerators of a `for`.
  #
  # The enumerators are the generators (`x <- xs`), guards (`if ...`) and value definitions (`y = ...`), and everything
  # they hold; the expression after `yield` and the body after `do` are not.
  #
  # A chain there never breaks at `break-at-count` selections, and it always breaks when it does not fit.
  #
  #   never-break - a chain the author broke is joined while it fits:
  #     for
  #       user <- users.filter(_.active)
  #     yield user.name
  #
  #   keep - a chain stays broken where the author broke it:
  #     for
  #       user <- users
  #                 .filter(_.active)
  #     yield user.name
  #
  in-for = never-break

  #
  # How a chain breaks in the arguments of a call.
  #
  # It covers the arguments of a call or of a constructor, positional or named, the elements of a tuple, the arguments
  # of an infix application with several of them (`x shouldBe (a, b)`), and everything they hold.
  #
  # The bodies of the lambdas and blocks given as arguments are not arguments: a chain there breaks like in any other
  # body. 
  #
  # A chain in an argument never breaks at `break-at-count` selections, and it always breaks when it does not fit.
  #
  #   never-break - a chain the author broke is joined while it fits:
  #     SignatureParts(
  #       nameEnd = d.name.pos.end,
  #     )
  #
  #   keep - a chain stays broken where the author broke it:
  #     SignatureParts(
  #       nameEnd = d
  #         .name
  #         .pos
  #         .end,
  #     )
  #
  in-call = never-break

  #
  # Whether a package path at the start of a chain stays together as its receiver.
  #
  # A package path is the run of lowercase names up to the first capitalised one: `java.nio.file.Files`.
  #
  #   always-join - always, even when the author broke the line inside the path:
  #     java.nio.file.Files
  #       .exists(path)
  #       .toString
  #
  #   keep - as always-join, unless the author broke the line inside the path.
  #
  #   always-break - the path breaks like any other selection:
  #     java
  #       .nio
  #       .file
  #       .Files
  #       .exists(path)
  #       .toString
  #
  namespace-path = keep

  #
  # Whether the first member selected on a capitalised name stays with it as the receiver.
  #
  #   always-join - always, even when the author broke the line before its dot:
  #     IO.pure(x)
  #       .map(f)
  #       .flatMap(g)
  #
  #   keep - as always-join, unless the author broke the line before its dot.
  #
  #   always-break - the member breaks like any other selection:
  #     IO
  #       .pure(x)
  #       .map(f)
  #       .flatMap(g)
  #
  object-member = always-break

  #
  # The shortest receiver name a chain breaks after.
  #
  # A shorter receiver keeps its first selection on its line, and that selection still counts towards
  # `break-at-count`.
  #
  #   <number> - at least 1. With 3, `v` keeps `.trim` and `values` breaks:
  #     v.trim
  #       .toLowerCase
  #       .nonEmpty
  #
  #     values
  #       .map(_.trim)
  #       .filter(_.nonEmpty)
  #       .size
  #
  receiver-min-length = 1
}

#
# Where each body goes relative to the separator before it: on its line, or below it one level in.
#
# The separators are the `=` of a definition, the `=>` of a lambda or a case, the `then` and `else` of an if/else, the
# `do` of a loop, and so on. There is one setting per construct.
#
# A construct with a single body (a definition, a lambda, a loop) takes these values:
#
#   keep - the body stays where the author wrote it.
#
#   always-join - the body on the line of its separator, even when the author wrote it below.
#
#   always-break - the body below its separator, even when the author wrote it on the line.
#
# The bodies of a construct with several of them (the branches of an if/else, the cases of a match, the bodies of a
# try) are treated as a group, never individually: either every body is on the line of its separator, or every body is
# below it. A construct where some bodies are inline and some others are on a new line are called mixed.
#
# These constructs take these values:
#
#   join-mixed - a mixed group is joined on the lines of the separators; a group all on its lines, or all below, stays
#   as it is.
#
#   break-mixed - a mixed group goes below the separators; a group all on its lines, or all below, stays as it is.
#
#   always-join - every body on the line of its separator.
#
#   always-break - every body below its separator.
#
# A group of one body (an `if` without `else`, a match with one case) is never mixed, so both `-mixed` values leave it
# as written.
#
# Whatever the setting, a body goes below its separator when it cannot be joined on its line: it does not fit there on
# one line, or a comment follows the separator. In a group, such a body puts every body of the group below its
# separator, and so does a body that holds an if, a match or a try.
#
# The settings move bodies only relative to their separators: an `else` written on its own line stays on its own line,
# and every `case` is on its own line.
#
# With braces (see `braces`), a body below its separator is in braces, and a construct whose bodies are on their lines
# has none: `if (c) a else b`, `for (x <- xs) f(x)`, `while (c) step()`.
#
body {
  #
  # The body after the `=` of a definition, an assignment (`x = 1`) or a named argument, one setting per keyword.
  #
  # A `def` whose signature is over several lines keeps its body where it is with `always-join`.
  #
  #   keep - the body stays where the author wrote it.
  #
  #   always-join - the body on the line of the `=`:
  #     def total = xs.sum
  #
  #   always-break - the body below the `=`:
  #     def total =
  #       xs.sum
  #
  def             = keep
  val             = keep
  lazy-val        = keep
  var             = keep
  given-alias     = keep
  type-def        = keep
  assignment      = keep
  named-argument  = keep

  #
  # The body after the `=>` of a lambda given in braces or after a colon (`lambda-argument`), and of any other lambda
  # (`lambda-body`).
  #
  #   keep - the body stays where the author wrote it.
  #
  #   always-join - the body on the line of the `=>`:
  #     xs.foreach { x => println(x) }
  #
  #   always-break - the body below the `=>`:
  #     xs.foreach { x =>
  #       println(x)
  #     }
  #
  lambda-argument = keep
  lambda-body     = keep

  #
  # The statements of a block given as an argument (`block-argument`) and of a test block (`test-block`), after their
  # `{` or their colon.
  #
  #   keep - the statements stay where the author wrote them.
  #
  #   always-join - the statements on the line of the `{`, with a `;` between several of them:
  #     Resource.make { open() }
  #
  #   always-break - the statements below the `{`:
  #     Resource.make {
  #       open()
  #     }
  #
  block-argument = keep
  test-block     = keep

  #
  # The branches after the `then` and the `else` of an if/else.
  #
  # The branches of an `else if` chain are one group with those of the outer if/else.
  # 
  # On the lines of their separators, the if/else stays on one line when the author wrote each `else` on the line of the
  # branch before it; otherwise every `else` starts a line of its own. Below their separators, an `else if` stays on the
  # line of its `else`.
  #
  # The examples are for this input:
  #
  #   if c then
  #     a
  #   else b
  #
  #   join-mixed - the group is mixed, so the first branch moves up:
  #     if c then a
  #     else b
  #
  #   break-mixed - the group is mixed, so the second branch goes below too:
  #     if c then
  #       a
  #     else
  #       b
  #
  #   always-join - as join-mixed, and a group all below its separators moves up too.
  #
  #   always-break - as break-mixed, and `if c then a else b` goes below too.
  #
  if = break-mixed

  #
  # The bodies after the `=>` of the cases of a `match`, a `{ case ... }` or a `catch`, which are one group.
  #
  # When a case would not fit once its arrow is aligned (see `alignment.arrows.cases`), every body goes below its `=>`.
  #
  # The examples are for this input:
  #
  #   x match {
  #     case 1 =>
  #       "one"
  #     case 22 => "two"
  #   }
  #
  #   join-mixed - the group is mixed, so every body moves on its `=>` line:
  #     x match {
  #       case 1  => "one"
  #       case 22 => "two"
  #     }
  #
  #   break-mixed - the group is mixed, so every body goes below its `=>`:
  #     x match {
  #       case 1 =>
  #         "one"
  #       case 22 =>
  #         "two"
  #     }
  #
  #   always-join - as join-mixed, also when every body is below its `=>`.
  #
  #   always-break - as break-mixed, also when every body is on its `=>` line.
  #
  case-body = break-mixed

  #
  # The bodies after the `try` and the `finally` of a try, which are one group.
  #
  # The cases after `catch` follow `case-body`.
  #
  # A try written on one line that fits stays as it is, unless its bodies go below their keywords.
  #
  # With `braces.try = force-braces`, the bodies of a try over several lines are always below their `{`.
  #
  # The examples, with `braces.try = force-indent`, are for this input:
  #
  #   try
  #     a()
  #   finally b()
  #
  #   join-mixed - the group is mixed, so both bodies go on the lines of their keywords:
  #     try a()
  #     finally b()
  #
  #   break-mixed - the group is mixed, so both bodies go below their keywords:
  #     try
  #       a()
  #     finally
  #       b()
  #
  #   always-join - as join-mixed, also when both bodies are below their keywords.
  #
  #   always-break - as break-mixed, also when both bodies are on the lines of their keywords.
  #
  try = break-mixed

  #
  # The body after the `do` of a `for` loop.
  #
  # A loop written on one line that fits stays as it is, unless `always-break`.
  #
  #   keep - the body stays where the author wrote it.
  #
  #   always-join - the body on the line of the `do`:
  #     for x <- xs do println(x)
  #
  #   always-break - the body below the `do`:
  #     for x <- xs do
  #       println(x)
  #
  # With `braces.for = force-braces`, a body on its line gives `for (x <- xs) println(x)`.
  #
  for = keep

  #
  # The expression after the `yield` of a for-comprehension.
  #
  # A for-comprehension written on one line that fits stays as it is, unless `always-break`.
  #
  #   keep - the expression stays where the author wrote it.
  #
  #   always-join - the expression on the line of the `yield`:
  #     yield x + y
  #
  #   always-break - the expression below the `yield`:
  #     yield
  #       x + y
  #
  #   break-complex - as always-break, but a simple expression, a single name, path (`ExitCode.Success`) or literal,
  #   stays on the line of the `yield`:
  #     yield
  #       x + y
  #
  #     yield name
  #
  for-yield = break-complex

  #
  # The body after the `do` of a `while` loop.
  #
  # A loop written on one line that fits stays as it is, unless `always-break`.
  #
  #   keep - the body stays where the author wrote it.
  #
  #   always-join - the body on the line of the `do`:
  #     while c do step()
  #
  #   always-break - the body below the `do`:
  #     while c do
  #       step()
  #
  # With `braces.while = force-braces`, a body on its line gives `while (c) step()`.
  #
  while = keep

  #
  # The statements of a body written on one line and separated by `;`, whatever the construct.
  #
  #   keep - they stay on one line, with their braces, while it fits:
  #     def this(s: String) = { this(s.toInt, 0); println(s) }
  #
  #   always-break - one statement per line, below the `=`:
  #     def this(s: String) =
  #       this(s.toInt, 0)
  #       println(s)
  #
  semicolon-statements = always-break
}

#
# The layout of the names where they are declared: the parameters and type parameters of `def`s and class
# constructors, and the selectors of an `import` or `export`.
#
# A signature that does not fit breaks one parameter per line, and every group of parameters breaks with it.
#
definition-site {
  #
  # Whether the last parameter, type parameter or import selector of a list laid out one per line is followed by a
  # comma.
  #
  # A list on one line never has one.
  #
  #   always - a comma after the last element too:
  #     def f(
  #       first: String,
  #       second: Boolean,
  #     ): Int = 1
  #
  #   never - no comma after the last element:
  #     def f(
  #       first: String,
  #       second: Boolean
  #     ): Int = 1
  #
  trailing-commas = always

  #
  # Where `)(` goes between the groups of parameters of a broken signature.
  #
  # A `using` or `implicit` keyword is placed like a parameter: on a line of its own when its group opens at the end of
  # a line, and on the `)(` line with next-group.
  #
  #   next-group - at the start of the next group, on the line of the closing `)`:
  #     def f[A](
  #       first: String,
  #       second: Boolean,
  #     )(numeric: Numeric[A],
  #     )(using
  #       ord: Ordering[A],
  #     ): Int = 1
  #
  #   previous-group - after the last parameter of the group before, with the parameters of the next group below it:
  #     def f[A](
  #       first: String,
  #       second: Boolean)(
  #       numeric: Numeric[A])(
  #       using
  #       ord: Ordering[A],
  #     ): Int = 1
  #
  groups-separator = next-group
}

#
# The layout of the arguments where they are passed: calls, constructor calls and tuples.
#
# A trailing `{ ... }` argument (`foldLeft(z) { (acc, x) => ... }`) is not a group, and follows its own rules.
#
call-site {
  #
  # Whether the last argument or tuple element of a list laid out one per line is followed by a comma.
  #
  # A list on one line never has one.
  #
  #   always - a comma after the last element too:
  #     compute(
  #       firstArgument,
  #       secondArgument,
  #     )
  #
  #   never - no comma after the last element:
  #     compute(
  #       firstArgument,
  #       secondArgument
  #     )
  #
  trailing-commas = always

  #
  # Where `)(` goes between the groups of arguments of a broken call.
  #
  #   previous-group - after the last argument of the group before, with the arguments of the next group below it:
  #     Resource.make(
  #       IO.blocking(Files.createTempFile(dir, prefix, ".tmp")))(
  #       temp => IO.blocking(Files.delete(temp)).void,
  #     )
  #
  #   next-group - at the start of the next group, on the line of the closing `)`:
  #     Resource.make(
  #       IO.blocking(Files.createTempFile(dir, prefix, ".tmp")),
  #     )(temp => IO.blocking(Files.delete(temp)).void,
  #     )
  #
  groups-separator = previous-group

  #
  # Which groups of arguments break when the groups of a call do not fit on one line.
  #
  #   break-all - every group, each argument on its own line (see `groups-separator` for an example).
  #
  #   last-first - only the last group, while the groups before it fit on the line of the call; every group when they
  #   do not:
  #     Resource.make(IO.blocking(Files.createTempFile(dir, prefix, ".tmp")))(
  #       temp => IO.blocking(Files.delete(temp)).void,
  #     )
  #
  #   independent - each group by itself, as in a call with one group: a group breaks when the author broke it or it
  #   does not fit, and the others stay as they are:
  #     Resource.make(
  #       acquire,
  #     )(release)
  #
  groups-break = last-first
}

#
# What lines up in columns.
#
# Only adjacent one-line items align: a blank line, an item over several lines or any other statement ends a group of
# aligned items (see also `across-comments`).
# 
# An item that would not fit once aligned breaks instead, and the items before and after it align separately.
#
alignment {
  #
  # The groups of keywords whose adjacent one-line definitions align their `=`.
  #
  # The keywords are `val`, `lazy-val`, `var`, `def`, `given-alias` and `type-def`. A keyword is in at most one group,
  # and a keyword in no group never aligns and ends the groups around it.
  #
  #   [[<keyword>, ...], ...] - the groups. With [[val, lazy-val, var, def]]:
  #     val name       = "dixtra"
  #     var count      = 0
  #     def totalCount = count * 2
  #
  #   With [[val, var], [def]], the `def` aligns with neither:
  #     val name  = "dixtra"
  #     var count = 0
  #     def totalCount = count * 2
  #
  #   With [[val, def]], the `var` aligns with nothing, and the definitions before and after it align separately:
  #     val name = "dixtra"
  #     var count = 0
  #     val totalCount = count * 2
  #     def f          = 1
  #
  #   [] - no definition aligns.
  #
  assignment-groups = [
    [val, lazy-val, var, def]
  ]

  #
  # The operators that align column by column.
  #
  # They align in adjacent one-line statements, in adjacent one-line elements of a list laid out one per line, and in
  # an operation that is the only argument of a call statement. Named arguments follow `named-arguments` instead.
  #
  #   [<operator>, ...] - the operators. With the default:
  #     total += x
  #     n     = 0
  #
  #     Seq(
  #       "org.typelevel" %% "cats-core" % "2.13.0",
  #       "co.fs2"        %% "fs2-io"    % "3.13.0",
  #     )
  #
  #   [] - no operator aligns.
  #
  operators = [
    "=", "+=", "-=", "*=", "/=", ":=", "++=", "%", "%%", "%%%"
  ]

  #
  # The arrows that align.
  #
  arrows {
    #
    # Whether the `=>` of adjacent one-line cases align.
    #
    #   true - aligned:
    #     case Some(value) => value
    #     case None        => default
    #
    #   false - not aligned:
    #     case Some(value) => value
    #     case None => default
    #
    cases = true

    #
    # Whether the `->` of the `a -> b` elements of a list laid out one per line align.
    #
    #   true - aligned:
    #     Map(
    #       "one"   -> 1,
    #       "three" -> 3,
    #     )
    #
    #   false - not aligned:
    #     Map(
    #       "one" -> 1,
    #       "three" -> 3,
    #     )
    #
    pairs = true

    #
    # Whether the `<-` and `=` of the enumerators of a `for` align.
    #
    #   true - aligned:
    #     for
    #       user     <- users
    #       userCount = users.size
    #       account  <- accounts(user)
    #     yield account
    #
    #   false - not aligned:
    #     for
    #       user <- users
    #       userCount = users.size
    #       account <- accounts(user)
    #     yield account
    #
    for-enumerators = true
  }

  #
  # Whether the `extends` of adjacent one-line definitions (classes, objects, traits, enum cases) align.
  #
  #   true - aligned:
  #     case Red   extends Color("red")
  #     case Green extends Color("green")
  #
  #   false - not aligned:
  #     case Red extends Color("red")
  #     case Green extends Color("green")
  #
  extends-clauses = true

  #
  # Whether the `=` of adjacent one-line named arguments align, in a call laid out one argument per line.
  #
  #   true - aligned:
  #     MyCaseClass(
  #       aaa  = "",
  #       name = 123,
  #     )
  #
  #   false - not aligned:
  #     MyCaseClass(
  #       aaa = "",
  #       name = 123,
  #     )
  #
  named-arguments = false

  #
  # Whether the comments at the end of consecutive lines of code start on one column, one space after the longest code.
  #
  # A line without a trailing comment ends a group.
  #
  #   true - aligned:
  #     run(1)     // one
  #     compute(2) // two
  #
  #   false - not aligned:
  #     run(1) // one
  #     compute(2) // two
  #
  trailing-comments = false

  #
  # Whether a comment on its own line between two items keeps them in one group.
  #
  # The items are definitions, statements, cases and list elements. A blank line still ends a group, and the
  # enumerators of a `for` always align across comments.
  #
  #   true - one group:
  #     val a   = 1
  #     // note
  #     val bbb = 2
  #
  #   false - two groups:
  #     val a = 1
  #     // note
  #     val bbb = 2
  #
  across-comments = false

  #
  # The alignment inside scaladocs.
  #
  scaladoc {
    #
    # Whether the descriptions of the tags of a scaladoc start on one column.
    #
    # Wrapped description lines continue under the start of their description.
    #
    #   true - aligned:
    #     @param source The source text.
    #     @param width  The maximum width.
    #     @return       The formatted text.
    #
    #   false - not aligned:
    #     @param source The source text.
    #     @param width The maximum width.
    #     @return The formatted text.
    #
    tags = false
  }
}

#
# Where blank lines go, beyond the ones the author wrote between statements.
#
# Some rules have no setting: a run of blank lines always becomes one, a method after another statement always gets a
# blank line before it (and before its annotations and comments), and the blank lines between imports are always
# removed, so groups of imports are not .supported
#
blank-lines {
  #
  # The blank lines at the edges of the body of each construct, one setting per construct.
  #
  # The edges are after the opening `{` (or after the header, without braces) and before the closing `}`; a body
  # without braces has no closing edge. For `package`, the edge is the blank line after the package clause.
  #
  #   always - a blank line at both edges:
  #     class A {
  #
  #       def f = 1
  #
  #     }
  #
  #   never - no blank line at the edges:
  #     class A {
  #       def f = 1
  #     }
  #
  #   keep - as written, made to agree: a blank line at either edge means one at both. Written with a blank line only
  #   after the `{`, the class gets one before the `}` too:
  #     class A {
  #
  #       def f = 1
  #
  #     }
  #
  # By default the containers and the test blocks keep the blank lines the author wrote, the package clause is followed
  # by one, and the other bodies never have any.
  #
  body-edges {
    abstract-class  = keep
    block-argument  = never
    case-body       = never
    case-class      = keep
    class           = keep
    def             = never
    enum            = keep
    extension       = keep
    for             = never
    for-yield       = never
    given-alias     = never
    given-instance  = keep
    if              = never
    lambda-argument = never
    lambda-body     = never
    lazy-val        = never
    match           = never
    new-anonymous   = never
    object          = keep
    package         = always
    package-object  = keep
    test-block      = keep
    trait           = keep
    try             = never
    val             = never
    var             = never
    while           = never
  }

  #
  # The blank line between two adjacent one-line definitions of different alignment groups.
  #
  # The groups are those of `alignment.assignment-groups`. The examples are with [[val], [def]].
  #
  #   keep - as written.
  #
  #   always - a blank line between them:
  #     val a = 1
  #
  #     def b = 2
  #
  #   never - no blank line between them:
  #     val a = 1
  #     def b = 2
  #
  between-alignment-groups = keep

  #
  # The blank line before a scaladoc that follows a line of code.
  #
  # At the start of a body (class, object, trait, enum, extension, package), a scaladoc that gets a blank line counts as
  # a blank line written at the opening edge, and `body-edges` decides.
  #
  #   always - before every scaladoc, except a one-line scaladoc right after a line that opens a block. With
  #   `body-edges.class = keep`, a scaladoc at the start of a class gives both edges a blank line:
  #     class Repository {
  #
  #       /** Description here */
  #       def read(): Int = 1
  #
  #     }
  #
  #   always-multiline - as always, for a multi-line scaladoc only; a one-line scaladoc stays as written, and does not
  #   count as a blank line at the start of a body:
  #     def a = 1
  #     /** One line */
  #     def b = 2
  #
  #   keep - as written.
  #
  #   never - no blank line, a method's included; after a line that opens a block, `body-edges` decides:
  #     def a = 1
  #     /** Description here */
  #     def b = 2
  
  before-scaladoc = always
}

#
# What happens to what goes past `max-column`, when breaking the construct is not the answer.
#
overflow {
  #
  # What happens to a line that goes past `max-column` only because of the comment at its end.
  #
  # A trailing comment never counts in the width, so the code before it never breaks because of it.
  #
  #   keep - the line stays longer than `max-column`:
  #     val total = prices.sum // a comment that does not fit
  #
  #   move-above - the comment moves to a line of its own above the code, at its indent, wrapped if it is too long:
  #     // a comment that does not fit
  #     val total = prices.sum
  #
  trailing-comment = keep
}

#
# The housekeeping of a whole file, applied after other formatting.
#
housekeeping {
  #
  # Whether the spaces and tabs at the end of each line are removed.
  #
  #   true - removed.
  #
  #   false - kept, though the layout of comments still trims the end of a comment.
  #
  trim-trailing-whitespace = true

  #
  # Whether the file ends with exactly one line break (standard Unix EOF).
  #
  #   true - a missing line break at the end of the file is added, and the blank lines at its end are removed.
  #
  #   false - the end of the file stays as written.
  #
  enforce-eof = true

  #
  # The line break written at the end of each line, string literals over several lines included.
  #
  #   lf - `\n`, as on Linux and macOS.
  #
  #   crlf - `\r\n`, as on Windows.
  #
  #   cr - `\r`, as on classic macOS (up to Mac OS 9).
  #
  #   keep - the line break of the file as it is written.
  #
  line-ending = keep
}

#
# The files to format inside the directories given to dixtra.
#
# The patterns are globs relative to the directory being formatted, with `/` between directories: `*` matches within a
# directory name, `**` across directories, `?` one character. A file is formatted when it matches an `included` pattern
# and neither it nor a directory above it matches an `excluded` pattern. Hidden directories (`.git`, `.metals`, ...) and
# `target` directories are always skipped, and a file given explicitly is always formatted.
#
paths {
  #
  # The files to format.
  #
  #   [<glob>, ...] - the patterns. With ["src/**"], only the files below `src` are formatted.
  #
  included = ["**"]

  #
  # The files and directories to skip among the included ones.
  #
  #   [<glob>, ...] - the patterns. With ["**/generated/**", "legacy/*.scala"], every directory named `generated` and
  #   the Scala files directly in `legacy` are skipped.
  #
  excluded = []
}

#
# Other settings for some of the files.
#
# Each key is a glob, as those of `paths`, relative to the directory of the configuration file (the working directory
# for `--config-string`), and its section sets any setting or alias except `paths`, `config-version` and
# `path-overrides`. A file gets the settings of every glob its path matches, over the rest of the configuration; two
# matching globs that give a setting different values fail the file. A glob holding a `.` must be quoted, or HOCON reads
# the `.` as a section separator.
#
#   { <glob> { <settings> }, ... } - the overrides. For example:
#     path-overrides {
#       path/to/file_1 {
#         call-site.trailing-commas = never
#       }
#       "path/to/other/file_2.scala" {
#         housekeeping.enforce-eof = false
#       }
#       "path/that/uses/**/globs/*" {
#         housekeeping.line-ending = lf
#       }
#     }
#
path-overrides {}
