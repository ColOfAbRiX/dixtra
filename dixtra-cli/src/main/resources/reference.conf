# The configuration of dixtra, with the default value of every setting.
#
# A project overrides only the settings it changes, in a `.dixtra.conf` file in its root or in any directory above the
# files it formats, or on the command line with `--config-string` / `--config-path`. An unknown key is ignored with a
# warning, so a typo never goes unnoticed, and an invalid value is rejected.
#
# Example `.dixtra.conf`:
#
#   max-column = 100
#   braces { style = stroustrup, if = force-braces, match = force-indent }
#   paths.excluded = ["**/generated/**"]
#
# The sections, in order, and the behaviour each one decides:
#
#   max-column              The width that makes a construct break
#   trailing-commas         A comma after the last element of a list laid out one element per line
#   trailing-comment-overflow  A line too long only because of its trailing comment
#   braces                  Braces or indentation for each construct (`if`, `match`, `class`, ...), and where
#                           braces go
#   selector-chain          When a chain of calls `a.b(c).d` breaks, one `.member` per line
#   body                    Whether a body stays after its `=` / `=>` / `then` / `do`, or goes below it, for each
#                           construct
#   definition-site         How the parameter clauses of a `def` or a class break
#   call-site               How the argument clauses of a call break
#   alignment               What lines up in columns: `=` of definitions, operators, arrows, comments, scaladoc tags
#   blank-lines             Blank lines inside the bodies of constructs, between groups, and before scaladoc
#   housekeeping            Trailing whitespace, the newline at the end of the file, line endings
#   paths                   The files of a directory to format
#   path-overrides          Other settings for some of the files
#
# A behaviour of one construct is spread over several sections: an `if` has `braces.if`, `body.if` and
# `blank-lines.body-edges.if`. Aliases set them under the name of the construct instead, as `if.braces`, `if.body` and
# `if.body-edges` (see "Aliases" in the README).

# The version of this configuration schema, a semantic version. A configuration without it is read as the current
# version. One written for a later version, or for another major version, is rejected instead of being half understood.
config-version = 1.0.0

# The longest a line can be. A construct that does not fit on one line within this width breaks: all of it, never part
# of it. With 40, `def f = compute(first, second)` fits and stays on one line, while
#
#   def f = compute(firstArgument, secondArgument)
#
# becomes
#
#   def f =
#     compute(firstArgument, secondArgument)
max-column = 120

# Whether the last element of a list laid out one element per line (arguments, parameters, type parameters, tuple
# elements) is followed by a comma. A list on one line never has one.
#
#   always - a comma after the last element too:
#     compute(
#       firstArgument,
#         secondArgument,
#       )
#
#   never - no comma after the last element:
#     compute(
#       firstArgument,
#       secondArgument
#     )
trailing-commas = always

# What happens to a line of code that goes past `max-column` only because of the comment at its end. A trailing comment
# never counts in the width: the code before it never breaks because of it.
#
#   keep - the line stays longer than `max-column`.
#
#   move-above - the comment moves to a line of its own above the code, at its indent, wrapped if it is too long:
#     // a comment that does not fit after the code
#     val total = prices.sum
trailing-comment-overflow = keep

# The braces: where they go (`style`, below), and how each construct writes its body:
#
#   force-braces - in curly braces:
#     class A {
#       def f = 1
#     }
#
#     if (c) {
#       a()
#     }
#
#   force-end - without braces, closed by an `end` marker when it spans several lines:
#     class A:
#       def f = 1
#     end A
#
#     if c then
#       a()
#     end if
#
#   force-indent - without braces and without an `end` marker, the body is only indented:
#     class A:
#       def f = 1
#
#     if c then
#       a()
#
#   keep - as the author wrote it.
#
# A construct that is not listed is `keep`. The constructs that have no `end` marker (`block-argument`, `case-body`,
# `lambda-argument`, `lambda-body`, `test-block`) reject `force-end`. A `for`, `while` or `if` written on one line that
# fits is left as it is, and a case class or an object without a body never gets braces.
braces {
  # Where the braces go relative to the code around them. It applies to every brace dixtra writes; the braces of
  # an argument (`xs.map { x => ... }`) and of a body after `=>` stay where they are.
  #
  #   1tbs - `{` at the end of the header line, `} else {` on one line:
  #     if (c) {
  #       a()
  #     } else {
  #       b()
  #     }
  #
  #   stroustrup - as 1tbs, but `else`, `catch`, `finally` and `yield` start the line after the closing `}`:
  #     if (c) {
  #       a()
  #     }
  #     else {
  #       b()
  #     }
  #
  #   allman - as stroustrup, and every opening `{` of a body goes on its own line:
  #     if (c)
  #     {
  #       a()
  #     }
  #     else
  #     {
  #       b()
  #     }
  style = 1tbs

  # The braces around the single selector of an `import` or `export`. The selectors keep their spelling (`_` / `*`,
  # `=>` / `as`), and an import with several selectors always keeps its braces.
  #
  #   force-braces - always in braces:
  #     import a.{ B }
  #     import a.{ * }
  #
  #   avoid-braces - without braces where the selector can stand alone; a rename (`{ B => C }`, `{ B as C }`) keeps
  #   them:
  #     import a.B
  #     import a.*
  #
  #   keep - as the author wrote it.
  imports = keep

  abstract-class = force-braces

  # A block of statements given as an argument, without lambda parameters, that is not a test block (see `test-block`).
  # After an operator, its braces always stay.
  #
  #   force-braces:
  #     Resource.make {
  #       open()
  #     }
  #
  #   force-indent:
  #     Resource.make:
  #       open()
  block-argument = force-braces

  # The body of a `case` clause over several lines.
  #
  #   force-braces:
  #     case p => {
  #       a()
  #       b()
  #     }
  #
  #   force-indent:
  #     case p =>
  #       a()
  #       b()
  case-body = force-indent

  # Only a case class with a body: `case class A(x: Int)` never gets `{}`.
  case-class = force-braces

  class = force-braces

  # The body of a `def` over several lines.
  #
  #   force-braces:
  #     def f = {
  #       val a = 1
  #       a + 1
  #     }
  #
  #   force-indent:
  #     def f =
  #       val a = 1
  #       a + 1
  def = force-indent

  enum = force-braces

  extension = force-braces

  # A `for` loop, without `yield`.
  #
  #   force-braces:
  #     for (x <- xs) { ... }
  #     for { ... } { ... }
  #
  #   force-indent:
  #     for x <- xs do ...
  for = force-indent

  # A for-comprehension.
  #
  #   force-braces:
  #     for { ... } yield { ... }
  #
  #   force-indent:
  #     for x <- xs yield ...
  for-yield = force-indent

  # A given alias: `given A: B = ...`.
  given-alias = keep

  # A given instance: `given A: B with { ... }`.
  given-instance = force-braces

  # An if/else. The two forms are never mixed in one if/else.
  #
  #   force-braces:
  #     if (c) { ... } else { ... }
  #
  #   force-indent:
  #     if c then ... else ...
  if = force-indent

  # A lambda passed as an argument.
  #
  #   force-braces:
  #     xs.map { x =>
  #       x + 1
  #     }
  #
  #   force-indent:
  #     xs.map: x =>
  #       x + 1
  lambda-argument = force-braces

  # The body of a lambda anywhere else: `x => { ... }`.
  lambda-body = keep

  lazy-val = force-indent

  # A match.
  #
  #   force-braces:
  #     x match {
  #       case 1 => a
  #     }
  #
  #   force-indent:
  #     x match
  #       case 1 => a
  match = force-braces

  # An anonymous class: `new A { ... }`.
  new-anonymous = force-braces

  # An object without a body never gets braces.
  object = force-braces

  # The single package clause of a file: `package a.b { ... }` or `package a.b` followed by its members.
  package = force-indent

  # A package object: `package object a { ... }`.
  package-object = keep

  # A test block: a block of statements given to a call labelled by a string, as the test cases of ScalaTest, MUnit,
  # specs2 or utest are:
  #
  #   "a parser" should { ... }
  #   it should "read a number" in { ... }
  #   test("a parser") { ... }
  #
  # After an operator (`"a parser" should { ... }`) its braces always stay, so only a call takes the braceless form:
  #
  #   force-braces:
  #     test("a parser") {
  #       parse("1")
  #     }
  #
  #   force-indent:
  #     test("a parser"):
  #       parse("1")
  test-block = force-braces

  trait = force-braces

  # A try: `try { ... } catch { ... } finally { ... }`.
  try = force-braces

  val = force-indent

  var = force-indent

  # A while loop.
  #
  #   force-braces:
  #     while (c) { ... }
  #
  #   force-indent:
  #     while c do ...
  while = force-braces
}

# When a chain of selections (`a.b(x).c.d`) breaks, one selection per line:
#
#   xs.filter(_.paid).map(_.amount).sum
#
# becomes
#
#   xs
#     .filter(_.paid)
#     .map(_.amount)
#     .sum
#
# A chain always breaks when it does not fit or when the author broke it before a dot.
selector-chain {
  # How many selections make a chain written below its `=` / `=>` break, even when it fits. The receiver (`xs`) does not
  # count. With 3, two selections stay on one line:
  #
  #   def total =
  #     xs.map(_.amount).sum
  #
  # and three break:
  #
  #   def total =
  #     xs.filter(_.paid).map(_.amount).sum
  #
  # becomes
  #
  #   def total =
  #     xs
  #       .filter(_.paid)
  #       .map(_.amount)
  #       .sum
  #
  # With `body.def = always-join`, a chain below the `=` that does not break moves up to the `=` line:
  # `def total = xs.map(_.amount).sum`.
  #
  # Only a chain that is a whole body counts. A chain inside an operation, an argument or a condition breaks only when
  # it does not fit, or when the author broke it before a dot: `p.speed.vertical >= config.minSpeed` stays on one line.
  break-at-count = 3

  # Whether a chain on the line of its `=` / `=>` breaks at `break-at-count` selections too.
  #
  #   keep - it stays on one line while it fits:
  #     val y = xs.map(_ + 1).filter(_ > 0).sum
  #
  #   break-at-count - it breaks like a chain written below the `=`, from `break-at-count` selections:
  #     val y =
  #       xs
  #         .map(_ + 1)
  #         .filter(_ > 0)
  #         .sum
  inline-chains = break-at-count

  # How a chain breaks in the enumerators of a `for`: its generators (`x <- xs`), guards (`if ...`) and value
  # definitions (`y = ...`), and everything they hold. The expression after `yield` and the body after `do` are not
  # enumerators. A chain there never breaks at `break-at-count` selections, and it always breaks when it does not fit.
  #
  #   for
  #     user <- users
  #             .filter(_.active)
  #   yield user.name
  #
  #   never-break - the chain the author broke is joined while it fits: `user <- users.filter(_.active)`.
  #
  #   keep - the chain stays broken where the author broke it.
  in-for = never-break

  # How a chain breaks in the arguments of a call or of a constructor, positional or named, in the elements of a tuple,
  # and in the arguments of an infix application with several of them (`x shouldBe (a, b)`), and everything they hold.
  # The bodies of the lambdas and blocks passed as arguments are not arguments: a chain there breaks like in any other
  # body. A chain in an argument never breaks at `break-at-count` selections, and it always breaks when it does not fit.
  #
  #   SignatureParts(
  #     nameEnd = d
  #       .name
  #       .pos
  #       .end,
  #   )
  #
  #   never-break - the chain the author broke is joined while it fits: `nameEnd = d.name.pos.end`.
  #
  #   keep - the chain stays broken where the author broke it.
  in-call = never-break

  # Whether the lowercase names at the start of a chain up to the first capitalised one, a package path, stay together
  # as its receiver.
  #
  #   always-join - always, even when the author broke the line inside the path:
  #     java.nio.file.Files
  #       .exists(path)
  #       .toString
  #
  #   keep - as always-join, unless the author broke the line inside the path.
  #
  #   always-break - the path breaks like any other selection:
  #     java
  #        .nio
  #        .file
  #        .Files
  #        .exists(path)
  #        .toString
  namespace-path = keep

  # Whether the first member selected on a capitalised name stays with it as the receiver.
  #
  #   always-join - always, even when the author broke the line before its dot:
  #     IO.pure(x)
  #       .map(f)
  #       .flatMap(g)
  #
  #   keep - as always-join, unless the author broke the line before its dot.
  #
  #   always-break - the member breaks like any other selection:
  #     IO
  #       .pure(x)
  #       .map(f)
  #       .flatMap(g)
  object-member = always-break

  # The shortest receiver name a chain breaks after. A shorter receiver keeps its first selection on its line, and that
  # selection still counts towards `break-at-count`. With 3, `v` keeps `.trim` and `values` breaks:
  #
  #   v.trim
  #     .toLowerCase
  #     .nonEmpty
  #
  #   values
  #     .map(_.trim)
  #     .filter(_.nonEmpty)
  receiver-min-length = 1
}

# Where each body goes relative to the separator before it: the `=` of a definition, the `=>` of a lambda or a case, the
# `then` and `else` of an if/else, and so on. There is one setting per construct, named as in `braces` and
# `blank-lines`.
#
# A construct with a single body (a definition, a lambda, a loop) takes these values:
#
#   keep - the body stays where the author wrote it.
#
#   always-join - the body on the line of its separator, even when the author wrote it below.
#
#   always-break - the body below its separator, even when the author wrote it on the line.
#
# The bodies of a construct with several of them (the branches of an if/else, the cases of a match, the bodies of a try)
# are a group, and a group is never mixed: either every body is on the line of its separator, or every body is below
# its separator, one level in. These constructs take these values:
#
#   join-mixed - a mixed group, some bodies on their lines and some below, is joined on the lines of the separators. A
#   group all on its lines, or all below, stays as it is.
#
#   break-mixed - a mixed group goes below the separators. A group all on its lines, or all below, stays as it is.
#
#   always-join - every body on the line of its separator.
#
#   always-break - every body below its separator.
#
# A group of one body (an `if` without `else`, a match with one case, a `try` without `finally`) is never mixed, so both
# `-mixed` values leave it as written.
#
# Whatever the setting, a body goes below its separator when it cannot be joined on its line: it does not fit there on
# one line, or a comment follows the separator. In a group, a body that cannot be joined puts every body of the group
# below its separator, and so does a body that holds an if, a match or a try.
#
# The settings move bodies only relative to their separators. They never change the rest of the layout: an `else`
# written on its own line stays on its own line, and every `case` is on its own line. With a brace style that uses
# braces (see `braces`), a body below its separator is in braces, and an if/else, a `for` or a `while` whose bodies are
# on the lines of their separators has no braces: `if (c) a else b`, `for (x <- xs) f(x)`, `while (c) step()`.
body {
  # The body after the `=` of a definition, an assignment (`x = 1`) or a named argument, one setting per keyword:
  #
  #   def total =
  #         xs.sum
  #
  #   keep - it stays below the `=`, and `def total = xs.sum` stays on one line.
  #
  #   always-join - it moves up: `def total = xs.sum`. A `def` whose signature is over several lines keeps its body
  #   where it is.
  #
  #   always-break - `def total = xs.sum` becomes the example above.
  def             = keep
  val             = keep
  lazy-val        = keep
  var             = keep
  given-alias     = keep
  type-def        = keep
  assignment      = keep
  named-argument  = keep

  # The body after the `=>` of a lambda passed in braces or after a colon (`lambda-argument`: `xs.map { x => ... }`,
  # `xs.map: x => ...`), and of any other lambda (`lambda-body`):
  #
  #   xs.foreach { x =>
  #     println(x)
  #   }
  #
  #   keep - it stays below the `=>`, and `xs.foreach { x => println(x) }` stays on one line.
  #
  #   always-join - it moves up: `xs.foreach { x => println(x) }`.
  #
  #   always-break - `xs.foreach { x => println(x) }` becomes the example above.
  lambda-argument = keep
  lambda-body     = keep

  # The statements of a block given as an argument (`block-argument`: `Resource.make { ... }`) and of a test block
  # (`test-block`, see `braces.test-block`), after their `{` or their colon:
  #
  #   "a parser" in {
  #     parse("1")
  #   }
  #
  #   keep - they stay below the `{`, and `"a parser" in { parse("1") }` stays on one line.
  #
  #   always-join - they move up: `"a parser" in { parse("1") }`, with a `;` between several statements.
  #
  #   always-break - `"a parser" in { parse("1") }` becomes the example above.
  block-argument = keep
  test-block     = keep

  # The branches after the `then` and the `else` of an if/else. The branches of an `else if` chain are one group with
  # the branches of the outer if/else. On the lines of their separators, the if/else stays on one line when the author
  # wrote each `else` on the line of the branch before it; otherwise every `else` starts a line of its own. Below their
  # separators, an `else if` stays on the line of its `else`.
  #
  #   if c then
  #     a
  #   else b
  #
  #   join-mixed - the group is mixed, so the first branch moves up:
  #     if c then a
  #     else b
  #
  #   break-mixed - the group is mixed, so the second branch goes below too:
  #     if c then
  #       a
  #     else
  #       b
  #
  #   always-join - as join-mixed; `if c then a else b` stays on one line.
  #
  #   always-break - as break-mixed; `if c then a else b` becomes the last example too.
  #
  # With join-mixed and break-mixed, `if c then a else b` and the last example stay as they are. With braces
  # (`braces.if = force-braces`), the branches on their lines are the same without braces, `if (c) a else b` or each
  # `else` on a line of its own, and below them each branch is in braces.
  if = break-mixed

  # The bodies after the `=>` of the cases of a `match`, a `{ case ... }` or a `catch`, which are one group:
  #
  #   x match {
  #     case 1 =>
  #       "one"
  #     case 22 => "two"
  #   }
  #
  #   join-mixed - the group is mixed, so every body moves on its `=>` line, the arrows aligned:
  #     x match {
  #       case 1  => "one"
  #       case 22 => "two"
  #     }
  #
  #   break-mixed - the group is mixed, so every body goes below its `=>`:
  #     x match {
  #       case 1 =>
  #         "one"
  #       case 22 =>
  #         "two"
  #     }
  #
  #   always-join - as join-mixed, also when every body is below its `=>`.
  #
  #   always-break - as break-mixed, also when every body is on its `=>` line.
  #
  # With join-mixed and break-mixed, the two results above stay as they are. When a case would not fit once its arrow
  # is aligned, every body goes below its `=>`, whatever the setting.
  case-body = break-mixed

  # The bodies after the `try` and the `finally` of a try, which are one group; the cases after `catch` follow
  # `case-body`. A try written on one line that fits stays as it is, unless its bodies go below their keywords. With
  # braces (`braces.try = force-braces`) the bodies of a try that does not stay on one line are always below their `{`:
  #
  #   try
  #     a()
  #   finally b()
  #
  #   join-mixed - the group is mixed, so both bodies go on the lines of their keywords:
  #     try a()
  #     finally b()
  #
  #   break-mixed - the group is mixed, so both bodies go below their keywords:
  #     try
  #       a()
  #     finally
  #       b()
  #
  #   always-join - as join-mixed, also when both bodies are below their keywords.
  #
  #   always-break - as break-mixed, also when both bodies are on the lines of their keywords.
  try = break-mixed

  # The body after the `do` of a `for` loop. A loop written on one line that fits stays as it is, unless
  # `always-break`.
  #
  #   for x <- xs do
  #     println(x)
  #
  #   keep - it stays below the `do`, and `for x <- xs do println(x)` stays on its line.
  #
  #   always-join - it moves up: `for x <- xs do println(x)`.
  #
  #   always-break - `for x <- xs do println(x)` becomes the example above.
  #
  # With braces (`braces.for = force-braces`), the body on its line puts the loop on one line, `for (x <- xs) f(x)`, and
  # below it the body is in braces.
  for = keep

  # The expression after the `yield` of a for-comprehension, as for `for`, and `break-complex`. A for-comprehension
  # written on one line that fits stays as it is, unless `always-break`.
  #
  #   for
  #     x <- xs
  #     y <- ys
  #   yield
  #     x + y
  #
  #   keep - it stays below the `yield`, and `yield x + y` stays on its line.
  #
  #   always-join - it moves up: `yield x + y`.
  #
  #   always-break - `yield x + y` becomes the example above.
  #
  #   break-complex - `yield x + y` becomes the example above, and a simple expression, a single name, path
  #   (`ExitCode.Success`) or literal, stays on its line: `yield name`, `yield 0`.
  #
  # Below the `yield`, with braces around the enumerators, the expression is in braces.
  for-yield = break-complex

  # The body after the `do` of a `while` loop, as for `for`: `while c do step()` or the body below the `do`. With braces
  # (`braces.while = force-braces`), the body on its line puts the loop on one line, `while (c) step()`, and below it
  # the body is in braces.
  while = keep

  # The statements of a body written on one line and separated by `;`, whatever the construct: a `def`, a secondary
  # constructor, a lambda.
  #
  #   def this(s: String) = { this(s.toInt, 0); println(s) }
  #
  #   keep - they stay on one line, with their braces, while it fits.
  #
  #   always-break - one statement per line, below the `=`:
  #     def this(s: String) =
  #       this(s.toInt, 0)
  #       println(s)
  semicolon-statements = always-break
 }

# The layout of the parameters where they are defined: the signatures of `def`s and class constructors.
definition-site {
  # Where `)(` goes between the groups of parameters of a broken signature. A `using` or `implicit` keyword is placed
  # like a parameter: on a line of its own when its group opens at the end of a line (the first group, a group after
  # `()`, or after `)(` with previous-group), and on the `)(` line with next-group.
  #
  #   def f(
  #     using
  #     ord: Ordering[Int],
  #   ): Int = 1
  #
  #   next-group - at the start of the next group, on the line of the closing `)`, with `using` there too:
  #     def f[A](
  #       first: String,
  #       second: Boolean,
  #     )(numeric: Numeric[A],
  #     )(using
  #       ord: Ordering[A],
  #     ): Int = 1
  #
  #   previous-group - after the last parameter of the group before, with the parameters of the next group below it:
  #     def f[A](
  #       first: String,
  #       second: Boolean)(
  #       numeric: Numeric[A])(
  #       using
  #       ord: Ordering[A],
  #     ): Int = 1
  groups-separator = next-group
}

# The layout of the arguments where they are passed: calls and constructor calls.
call-site {
  # Where `)(` goes between the groups of arguments of a call that does not fit on one line. When one group breaks,
  # every group breaks, each argument on its own line, and the closing `)` aligns with the start of the call. A trailing
  # `{ ... }` argument (`foldLeft(z) { (acc, x) => ... }`) is not a group and keeps its own rules.
  #
  #   previous-group - after the last argument of the group before, with the arguments of the next group below it:
  #     Resource.make(
  #       IO.blocking(Files.createTempFile(directory, prefix, ".tmp")))(
  #       temp => IO.blocking(Files.deleteIfExists(temp)).void,
  #     )
  #
  #   next-group - at the start of the next group, on the line of the closing `)`:
  #     Resource.make(
  #       IO.blocking(Files.createTempFile(directory, prefix, ".tmp")),
  #     )(temp => IO.blocking(Files.deleteIfExists(temp)).void,
  #     )
  groups-separator = previous-group

  # Which argument groups break when the groups of a call do not fit on one line.
  #
  #   break-all - every group, each argument on its own line (see above):
  #     Option.when(
  #       gap.isBlank && text.startsLine(brace.start))(
  #       Edit(brace.end, keyword.start, "\n" + " " * text.indentOf(brace.start)),
  #     )
  #
  #   last-first - only the last group, while the groups before it fit on the line of the call, written there on one
  #   line; every group when they do not:
  #     Option.when(gap.isBlank && text.startsLine(brace.start))(
  #       Edit(brace.end, keyword.start, "\n" + " " * text.indentOf(brace.start)),
  #     )
  #
  #   independent - each group by itself, as in a call with one group: a group breaks when the author broke it or it
  #   does not fit from where it starts, and the others stay as they are:
  #     Resource.make(
  #        IO.blocking(Files.createTempFile(directory, prefix, ".tmp"))),
  #      )(temp => IO.blocking(Files.deleteIfExists(temp)).void)
  groups-break = last-first
}

# What aligns with what. Only adjacent one-line items align: a blank line, an item over several lines or any other
# statement ends a group of aligned items.
alignment {
  # Adjacent one-line definitions align their `=` when their keywords are in the same group. A keyword in no group never
  # aligns, and a keyword is in at most one group. The keywords are val, lazy-val, var, def, given-alias and type-def.
  #
  # With [[val, lazy-val, var, def]]:
  #
  #   val name      = "dixtra"
  #   var count     = 0
  #   def totalCount = count * 2
  #
  # With [[val, var], [def]], the `def` aligns with neither:
  #
  #   val name  = "dixtra"
  #   var count = 0
  #   def totalCount = count * 2
  #
  # A keyword left out of every group never aligns, and it ends the groups around it: with [[val, def]], the `var`
  # aligns with nothing and the definitions before and after it align separately:
  #
  #   val name = "dixtra"
  #   var count = 0
  #   val totalCount = count * 2
  #   def f         = 1
  #
  # A definition that would not fit once aligned breaks after its `=` instead, and the definitions before and after it
  # align separately.
  assignment-groups = [
    [val, lazy-val, var, def]
  ]

  # The operators that align column by column in adjacent one-line statements, in adjacent one-line elements of a list
  # laid out one per line, and in an operation that is the only argument of a call statement. Named arguments align
  # by `named-arguments` instead.
  #
  #   total += x
  #   n = 0
  #
  # becomes
  #
  #   total += x
  #   n     = 0
  #
  # and the elements of a SBT dependency list:
  #
  #   "org.typelevel" %% "cats-core" % "2.13.0",
  #   "co.fs2"        %% "fs2-io"    % "3.13.0",
  operators = [
    "=", "+=", "-=", "*=", "/=", ":=", "++=", "%", "%%", "%%%"
  ]

  arrows {
    # The `=>` of adjacent one-line cases:
    #
    #   case Some(value) => value
    #   case None        => default
    cases = true

    # The `->` of the `a -> b` elements of an argument list laid out one per line:
    #
    #   Map(
    #     "one"   -> 1,
    #     "three" -> 3,
    #   )
    pairs = true

    # The expressions of the enumerators of a for-comprehension:
    #
    #   for
    #     user     <- users
    #       userCount = users.size
    #       account  <- accounts(user)
    #     yield account
    for-enumerators = true
  }

  # The `extends` of adjacent one-line definitions (classes, objects, traits, enum cases):
  #
  #   case Red   extends Color("red")
  #   case Green extends Color("green")
  extends-clauses = true

  # Whether the `=` of adjacent one-line named arguments align, in a call or a case class construction laid out one
  # argument per line:
  #
  #   false:
  #     MyCaseClass(
  #       aaa = "",
  #       name = 123,
  #     )
  #
  #   true:
  #     MyCaseClass(
  #       aaa  = "",
  #       name = 123,
  #     )
  named-arguments = false

  # Whether the comments at the end of consecutive lines of code start on one column, one space after the longest code.
  # A blank line, or a line without a trailing comment, ends a group. A line that would go past `max-column` once
  # aligned is left as it is, and the lines before and after it align separately.
  #
  #   false:
  #     val a = 1 // one
  #     val bbb = 2 // two
  #
  #   true:
  #     val a = 1   // one
  #     val bbb = 2 // two
  trailing-comments = false

  # Whether a comment on its own line between two items (definitions, statements, cases, list elements) keeps them in
  # one group. A blank line still ends a group, and the enumerators of a `for` always align across comments.
  #
  #   true:
  #     val a   = 1
  #     // note
  #     val bbb = 2
  #
  #   false:
  #     val a = 1
  #     // note
  #     val bbb = 2
  across-comments = false

  scaladoc {
    # Whether the descriptions of the tags of a scaladoc align on one column. Wrapped description lines continue under
    # the start of their description.
    #
    #   true:
    #     @param source The source text.
    #     @param width  The maximum width.
    #     @return       The formatted text.
    #
    #   false:
    #     @param source The source text.
    #     @param width The maximum width.
    #     @return The formatted text.
    tags = false
  }
}

# Where blank lines go, beyond the ones the author wrote between statements: at the edges of bodies, between
# definitions of different alignment groups and before scaladocs. A run of blank lines always becomes one, a method
# after another statement always gets a blank line before it (and before its annotations and comments), and the blank
# lines between imports are always removed: groups of imports are not supported.
blank-lines {
  # The blank lines at the edges of the body of each construct: after its opening `{` (or its header, without braces)
  # and before its closing `}`. A body without braces has no closing edge. For `package`, `always` means a blank line
  # after the package clause.
  #
  #   always - a blank line at both edges:
  #     class A {
  #
  #       def f = 1
  #
  #     }
  #
  #   never - no blank line at the edges:
  #     class A {
  #       def f = 1
  #     }
  #
  #   keep - as written, made to agree: a blank line at either edge means one at both. Written with a blank line only
  #   after the `{`, the class above gets one before the `}` too.
  #
  # `lambda-argument` is a lambda or a `{ case ... }` given as an argument (`xs.map { x => ... }`), `block-argument` a
  # block of statements given as an argument (`Resource.make { ... }`), and `test-block` the block of a test case (see
  # `braces.test-block`). By default the test cases keep the blank lines the author wrote, and the other two never have
  # any:
  #
  #   "a parser" should {
  #
  #     "read a number" in {
  #       val r = Resource.make {
  #         open()
  #       }
  #       ...
  #     }
  #
  #   }
  body-edges {
    abstract-class  = keep
    block-argument  = never
    case-body       = never
    case-class      = keep
    class           = keep
    def             = never
    enum            = keep
    extension       = keep
    for             = never
    for-yield       = never
    given-alias     = never
    given-instance  = keep
    if              = never
    lambda-argument = never
    lambda-body     = never
    lazy-val        = never
    match           = never
    new-anonymous   = never
    object          = keep
    package         = always
    package-object  = keep
    test-block      = keep
    trait           = keep
    try             = never
    val             = never
    var             = never
    while           = never
  }

  # The blank line between two adjacent one-line definitions of different alignment groups (see
  # `alignment.assignment-groups`).
  #
  #   keep - as written.
  #
  #   always - a blank line between them. With [[val], [def]]:
  #     val a = 1
  #
  #     def b = 2
  #
  #   never - no blank line between them:
  #     val a = 1
  #     def b = 2
  between-alignment-groups = keep

  # The blank line before a scaladoc.
  #
  #   always - a blank line before every scaladoc that follows a line of code, except a one-line scaladoc right after a
  #   line that opens a block. At the start of a body (class, object, trait, enum, extension, package) a scaladoc counts
  #   as a blank line written at its opening edge, and `body-edges` decides: with `keep`, both edges then get one:
  #     class Repository {
  #       /** Description here */
  #       def read(): Int = ...
  #     }
  #   becomes
  #     class Repository {
  #
  #       /** Description here */
  #       def read(): Int = ...
  #
  #     }
  #
  #   always-multiline - as always, for a multi-line scaladoc only; a one-line scaladoc stays as written, and does not
  #   count as a blank line at the start of a body.
  #
  #   keep - as written.
  #
  #   never - no blank line between a line of code and the scaladoc after it, a method's included. After a line that
  #   opens a block, `body-edges` decides:
  #     def a = 1
  #     /** Description here */
  #     def b = 2
  before-scaladoc = always
}

# The housekeeping of a whole file, applied after the formatting.
housekeeping {
  # Whether the spaces and tabs at the end of each line are removed. Those at the end of a line inside a string literal
  # are part of the string, and always stay.
  #
  #   true - removed.
  #
  #   false - not removed, though the layout of comments still trims the end of a comment.
  trim-trailing-whitespace = true

  # Whether the file ends with exactly one line break.
  #
  #   true - a missing line break at the end of the file is added, and the blank lines at its end are removed.
  #
  #   false - the end of the file stays as written.
  enforce-eof = true

  # The line break written at the end of each line, string literals over several lines included.
  #
  #   lf - `\n`, as on Linux and macOS.
  #
  #   crlf - `\r\n`, as on Windows.
  #
  #   cr - `\r`, as on classic macOS (up to Mac OS 9).
  #
  #   keep - the line break of the file as it is written.
  line-ending = keep
}

## The files to format inside the directories given to dixtra. The patterns are globs relative to the directory being
## formatted, with `/` between directories: `*` matches within a directory name, `**` across directories, `?` one
## character.
##
## A file is formatted when it matches an `included` pattern and neither it nor a directory above it matches an
## `excluded` pattern. Hidden directories (`.git`, `.metals`, ...) and `target` directories are always skipped, and a
## file given explicitly is always formatted. For example:
##
##   included = ["src/**"]
##   excluded = ["**/generated/**", "legacy/*.scala"]
paths {
  included = ["**"]
  excluded = []
}

# Settings for some of the files only. Each key is a glob, as those of `paths`, relative to the directory of the
# configuration file (the working directory for `--config-string`), and its section sets any setting or alias but
# `paths`, `config-version` and `path-overrides`. A file gets the settings of every glob its path matches, over the
# rest of the configuration; two matching globs that give a setting different values fail the file. A glob holding a
# `.` must be quoted, or HOCON reads the `.` as a section separator. For example:
#
#   path-overrides {
#     path/to/file_1 {
#       trailing-commas = never
#     }
#     "path/to/other/file_2.scala" {
#       housekeeping.enforce-eof = false
#     }
#     "path/that/uses/**/globs/*" {
#       housekeeping.line-ending = lf
#     }
#   }
path-overrides {}
