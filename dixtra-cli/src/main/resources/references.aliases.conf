#
# The defaults of dixtra grouped by Scala construct through the aliases, rather than by the areas of reference.conf.
# dixtra doesn't read this file: reference.conf holds the defaults and documents every setting, and aliases.conf lists
# the aliases. It shows how a configuration written through the aliases looks, and can be copied as a starting point.
#

max-column      = 120
trailing-commas = always

abstract-class {
  braces     = force-braces
  body-edges = keep
}

assignment {
  body = keep
}

block-argument {
  braces     = force-braces
  body       = keep
  body-edges = never
}

case-body {
  braces     = force-indent
  body       = break-mixed
  body-edges = never
}

case-class {
  braces     = force-braces
  body-edges = keep
}

class {
  braces     = force-braces
  body-edges = keep
}

def {
  braces            = force-indent
  body              = keep
  body-edges        = never
  groups-separator = next-group
}

enum {
   braces    = force-braces
   body-edges = keep
}

extension {
   braces    = force-braces
   body-edges = keep
}

for {
   braces    = force-indent
   body    = keep
   body-edges = never
}

for-yield {
   braces    = force-indent
   body    = break-complex
   body-edges = never
}

given-alias {
   braces    = keep
   body    = keep
   body-edges = never
}

given-instance {
   braces    = force-braces
   body-edges = keep
}

if {
   braces    = force-indent
   body    = break-mixed
   body-edges = never
}

lambda-argument {
  braces    = force-braces
  body      = keep
  body-edges = never
}

lambda-body {
  braces    = keep
  body      = keep
  body-edges = never
}

lazy-val {
  braces    = force-indent
  body      = keep
  body-edges = never
}

match {
  braces    = force-braces
  body-edges = never
}

named-argument {
  body        = keep
  align-equals = false
}

new-anonymous {
  braces    = force-braces
  body-edges = never
}

object {
  braces    = force-braces
  body-edges = keep
}

package {
  braces     = force-indent
  body-edges = always
}

package-object {
  braces     = keep
  body-edges = keep
}

test-block {
  braces     = force-braces
  body       = keep
  body-edges = keep
}

trait {
  braces     = force-braces
  body-edges = keep
}

try {
  braces     = force-braces
  body       = break-mixed
  body-edges = never
}

type-def {
  body = keep
}

val {
  braces     = force-indent
  body       = keep
  body-edges = never
}

var {
  braces     = force-indent
  body       = keep
  body-edges = never
}

while {
  braces     = force-braces
  body       = keep
  body-edges = never
}

comments {
  align-trailing    = false
  align-across      = false
  trailing-overflow = keep
}

scaladoc {
  blank-line-before = always
  align-tags        = false
}

# The settings that several aliases share, or that no alias reaches

braces {
  style   = 1tbs
  imports = keep
}

body {
  semicolon-statements = always-break
}

selector-chain {
  break-at-count      = 3
  inline-chains       = break-at-count
  in-for              = never-break
  in-call             = never-break
  namespace-path      = keep
  object-member       = always-break
  receiver-min-length = 1
}

call-site {
  groups-separator = previous-group
  groups-break     = last-first
}

alignment {
  assignment-groups = [
    [val, lazy-val, var, def]
  ]
  operators = [
    "=", "+=", "-=", "*=", "/=", ":=", "++=", "%", "%%", "%%%"
  ]
  arrows {
    cases           = true
    pairs           = true
    for-enumerators = true
  }
  extends-clauses = true
}

blank-lines {
  between-alignment-groups = keep
}

housekeeping {
  trim-trailing-whitespace = true
  enforce-eof              = true
  line-ending              = keep
}

paths {
  included = ["**"]
  excluded = []
}

path-overrides {}
