<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111B" />
    </linearGradient>

    <!-- Scala Red Gradients for Layers -->
    <linearGradient id="scalaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D5D" />
      <stop offset="100%" stop-color="#DE3434" />
    </linearGradient>

    <linearGradient id="scalaMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#B81D2A" />
    </linearGradient>

    <linearGradient id="scalaBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C1121F" />
      <stop offset="100%" stop-color="#780016" />
    </linearGradient>

    <!-- Accent Cyan Gradient (Formatter Glow) -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80EEFF" />
      <stop offset="100%" stop-color="#00C8E5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Glow Filter for Magic Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background Filling the Canvas -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)" />

  <!-- Outer Subtle Border Ring -->
  <rect x="6" 
        y="6" 
        width="500" 
        height="500" 
        rx="74" 
        fill="none" 
        stroke="#FFFFFF"
        stroke-opacity="0.06"
        stroke-width="4" />

  <!-- Scalable Group for Icon Content -->
  <g filter="url(#dropShadow)">
    
    <!-- === SCALA STACK LAYERS === -->
    
    <!-- Bottom Layer -->
    <path d="M 100 352 
             C 100 327, 320 337, 412 302 
             L 412 362 
             C 320 397, 100 377, 100 352 Z" fill="url(#scalaBot)" />

    <!-- Middle Layer -->
    <path d="M 100 256 
             C 100 231, 320 241, 412 206 
             L 412 266 
             C 320 301, 100 281, 100 256 Z" fill="url(#scalaMid)" />

    <!-- Top Layer -->
    <path d="M 100 160 
             C 100 135, 320 145, 412 110 
             L 412 170 
             C 320 205, 100 185, 100 160 Z" fill="url(#scalaTop)" />

    <!-- === CENTER UPPERCASE 'D' (At Y=236, optically centered between curly braces) === -->
    <text
      x="260"
      y="236"
      font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, DejaVu Sans, sans-serif"
      font-weight="900"
      font-size="280"
      fill="#FFFFFF"
      text-anchor="middle"
      dominant-baseline="central"
      filter="url(#glow)">
        D
    </text>

    <!-- === FORMATTER BRACKETS ({ }) OVERLAY === -->
    <!-- Left Curly Bracket -->
    <path d="M 80 80 
             C 55 80, 48 100, 48 125 
             L 48 210 
             C 48 230, 32 242, 16 256 
             C 32 270, 48 282, 48 302 
             L 48 387 
             C 48 412, 55 432, 80 432" 
      fill="none"
      stroke="url(#cyanAccent)"
      stroke-width="20"
      stroke-linecap="round"
      filter="url(#glow)" />

    <!-- Right Curly Bracket -->
    <path d="M 432 80 
             C 457 80, 464 100, 464 125 
             L 464 210 
             C 464 230, 480 242, 496 256 
             C 480 270, 464 282, 464 302 
             L 464 387 
             C 464 412, 457 432, 432 432" 
      fill="none"
      stroke="url(#cyanAccent)"
      stroke-width="20"
      stroke-linecap="round"
      filter="url(#glow)" />

    <!-- === ALIGNMENT / OPINIONATED RULES LINES === -->
    <g stroke="#80EEFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6">
      <line x1="120" y1="160" x2="392" y2="160" />
      <line x1="120" y1="256" x2="392" y2="256" />
      <line x1="120" y1="352" x2="392" y2="352" />
    </g>

    <!-- Sparkling "Auto-Format Magic" Elements (Relocated to clean corner positions) -->
    <path
      d="M 475 52 L 478 61 L 487 64 L 478 67 L 475 76 L 472 67 L 463 64 L 472 61 Z"
      fill="#80EEFF"
      filter="url(#glow)" />

    <path
      d="M 42 445 L 45 454 L 54 457 L 45 460 L 42 469 L 39 460 L 30 457 L 39 454 Z"
      fill="#80EEFF"
      filter="url(#glow)" />

    <circle cx="488" cy="90" r="3.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
