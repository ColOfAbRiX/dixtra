rules = [
  ExplicitResultTypes,
  OrganizeImports,
  RedundantSyntax,
  RemoveUnused
]

OrganizeImports {
  targetDialect                     = Scala3
  blankLines                        = Auto
  coalesceToWildcardImportThreshold = 1
  expandRelative                    = true
  groupedImports                    = Merge
  groups                            = [ "\"*\"" ]
  removeUnused                      = true
}
